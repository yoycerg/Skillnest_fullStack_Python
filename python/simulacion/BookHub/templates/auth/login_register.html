{% extends "base.html" %}
{% block title %}BookHub - Login / Registro{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="text-center mb-4">
        <div class="display-3">📖</div>
        <h1 class="fw-bold">BookHub</h1>
        <p class="text-muted">Comparte, descubre y comenta libros</p>
    </div>

    <div class="row g-4 justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm h-100">
                <div class="card-body">
                    <h3 class="mb-3">Crear Cuenta</h3>
                    <form method="POST" action="{{ url_for('auth.register') }}">
                        <div class="mb-2">
                            <label class="form-label">Nombre</label>
                            <input class="form-control" name="first_name" required minlength="2">
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Apellido</label>
                            <input class="form-control" name="last_name" required minlength="2">
                        </div>
                        <div class="mb-2">
                            <label class="form-label">E-mail</label>
                            <input class="form-control" type="email" name="email" required>
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Contraseña</label>
                            <input class="form-control" type="password" name="password" required minlength="8">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Confirmar Contraseña</label>
                            <input class="form-control" type="password" name="confirm_password" required minlength="8">
                        </div>
                        <button class="btn btn-dark w-100">Registrarse</button>
                    </form>
                    <p class="mt-3 mb-0 text-center">
                        ¿Ya tienes cuenta?
                        <a href="{{ url_for('auth.login') }}">Inicia sesión</a>
                    </p>
                </div>
            </div>
        </div>

        <div class="col-md-5">
            <div class="card shadow-sm h-100">
                <div class="card-body">
                    <h3 class="mb-3">Iniciar Sesión</h3>
                    <form method="POST" action="{{ url_for('auth.login') }}">
                        <div class="mb-3">
                            <label class="form-label">E-mail</label>
                            <input class="form-control" type="email" name="email" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Contraseña</label>
                            <input class="form-control" type="password" name="password" required>
                        </div>
                        <button class="btn btn-dark w-100">Iniciar Sesión</button>
                    </form>
                    <p class="mt-3 mb-0 text-center">
                        ¿No tienes cuenta?
                        <a href="{{ url_for('auth.register') }}">Regístrate</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
