<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Registro de Productos</title>

</head>

<body>

    <h1>Registro de Productos</h1>

    <nav>
        <a href="{{ url_for('index') }}">Inicio</a>
        |
        <a href="{{ url_for('ayuda') }}">Ayuda</a>
    </nav>

    <hr>

    <form
        action="{{ url_for('registrar') }}"
        method="POST">

        <!-- Nombre del producto -->

        <label for="nombre">

            Producto:

        </label>

        <input
            type="text"
            id="nombre"
            name="nombre"
            required>

        <br><br>


        <!-- Precio -->

        <label for="precio">

            Precio:

        </label>

        <input
            type="number"
            id="precio"
            name="precio"
            step="0.01"
            required>

        <br><br>


        <!-- Categoría -->

        <label for="categoria">

            Categoría:

        </label>

        <input
            type="text"
            id="categoria"
            name="categoria"
            required>

        <br><br>


        <!-- Botón de envío -->

        <button type="submit">

            Registrar Producto

        </button>

    </form>

</body>

</html>
